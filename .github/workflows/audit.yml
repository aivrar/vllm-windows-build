name: Windows audit

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Compile maintained Python files
        run: >-
          python -m py_compile
          verify_artifact.py verify_install.py engine_dispatcher.py
          vllm_launcher.py assemble_wheel_cu128_v0.25.1.py
          tests/test_verify_artifact.py tests/test_bootstrap_helpers.py
          tests/test_engine_dispatcher.py
          tests/test_release_contract.py tests/test_wheel_contents.py
          tests/test_windows_kv_offload.py tests/test_windows_kv_tiering.py
          tests/test_v19.py
      - name: Run pure regression suite
        run: >-
          python -m unittest
          tests.test_verify_artifact tests.test_bootstrap_helpers
          tests.test_engine_dispatcher
          tests.test_release_contract -v
      - name: Validate candidate patch against upstream v0.29.0
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.29.0 https://github.com/vllm-project/vllm.git patch-check
          git -C patch-check apply --check ../vllm-windows-v11.patch
          git -C patch-check apply ../vllm-windows-v11.patch
          git -C patch-check apply --check ../vllm-cu132-topk.patch
          git clone https://github.com/vllm-project/flash-attention.git flash-attn-check
          git -C flash-attn-check checkout 06bdd47c0d0383daf6a2ff0c418faff9c6da16e5
          git -C flash-attn-check apply --check ../flash-attn-python314.patch
